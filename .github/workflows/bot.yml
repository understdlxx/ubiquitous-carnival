# WAREHUS BOT — free 24/7 hosting on GitHub Actions
#
# How it works:
#   - GitHub Actions jobs have a 6-hour hard limit, so this job runs ~5h50m,
#     then a scheduled run every 6 hours restarts it (concurrency = old one dies first).
#   - The bot token NEVER touches the repo: it is read at runtime from
#     the repository secret DISCORD_TOKEN (Settings > Secrets and variables > Actions).
#
# Start it once manually:  Actions tab > Warehus Bot Uptime > Run workflow
# After that it keeps restarting itself.

name: Warehus Bot Uptime

on:
  workflow_dispatch:        # manual start button
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours -> fresh 6h shift

concurrency:
  group: warehus-bot
  cancel-in-progress: true  # never two instances at once

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # stop BEFORE github's 360m hard kill
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # data/ (settings.json + warnings.json) survives the 6h restarts.
      # It lives in the PRIVATE Actions cache — it is NEVER committed,
      # so nothing leaks into the public repo.
      - name: Restore bot data (private cache, nothing gets committed)
        uses: actions/cache@v4
        with:
          path: data
          key: warehus-data-${{ github.run_id }}
          restore-keys: |
            warehus-data-

      - name: Run bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python main.py
